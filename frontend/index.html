<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#bf6848" />
    <meta
      name="description"
      content="Smart Nigrani System: explainable review support for MPLADS works in Maharashtra, with field evidence and oversight workflows."
    />
    <!-- Warm up the font connection before the CSS import is even parsed. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Smart Nigrani System</title>
    <script>
      // Apply the saved theme before the first paint, so a dark-mode visitor
      // never sees a flash of the light page while the app loads.
      try {
        var saved = localStorage.getItem('sns.theme')
        if (saved === 'dark' || saved === 'light') document.documentElement.setAttribute('data-theme', saved)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
